<style type="text/css">
:root {
    --bg-primary: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f1f5f9;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent-primary: #3b82f6;
    --accent-secondary: #e0e7ff;
    --accent-hover: #2563eb;
    --border-light: #e2e8f0;
    --border-medium: #cbd5e1;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius-sm: 0.375rem;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
}

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
}

html { 
    overflow-y: scroll; 
}

/* Input Bar Styling */
#input-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-light);
    padding: 1rem;
    box-shadow: var(--shadow-lg);
    z-index: 100;
}

#input-wrapper {
    max-width: 75%;
    margin: 0 auto;
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
}

#writing {
    flex: 1;
    min-height: 2.5rem;
    max-height: 8rem;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-lg);
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.875rem;
    resize: none;
    outline: none;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
}

#writing:focus {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px var(--accent-secondary);
}

#writing::placeholder {
    color: var(--text-muted);
}

#send-button {
    min-width: 2.5rem;
    height: 2.5rem;
    background: var(--accent-primary);
    color: white;
    border: none;
    border-radius: var(--radius-lg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
}

#send-button:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

#send-button:disabled {
    background: var(--text-muted);
    cursor: not-allowed;
    transform: none;
    box-shadow: var(--shadow-sm);
}

/* Main Chat Area */
#wrapper { 
    width: 75%; 
    margin: 1rem auto 6rem auto; 
    word-wrap: break-word;
    padding: 0 1rem;
}

#main {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

/* Message Bubbles */
.message-bubble {
    max-width: 70%;
    margin-bottom: 0.5rem;
    animation: fadeIn 0.3s ease-out;
}

.message-bubble.own {
    align-self: flex-start;
    margin-right: auto;
}

.message-bubble.other {
    align-self: flex-start;
    margin-right: auto;
}

.message-username {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    font-weight: 500;
}

.message-bubble.own .message-username {
    text-align: left;
}

.message-content {
    background: var(--bg-secondary);
    padding: 0.75rem 1rem;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    position: relative;
    transition: all 0.2s ease;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.message-bubble.own .message-content {
    background: var(--accent-primary);
    color: white;
    border-color: var(--accent-primary);
}

.message-content:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}

.message-content a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: currentColor;
    opacity: 0.8;
}

.message-bubble.own .message-content a {
    color: white;
}

/* Timestamp tooltip */
.message-timestamp {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: white;
    padding: 0.25rem 0.5rem;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    z-index: 1000;
    margin-bottom: 0.25rem;
}

.message-timestamp::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--text-primary);
}

.message-content:hover .message-timestamp {
    opacity: 1;
    visibility: visible;
}

/* Sidebar */
#right { 
    width: 20%; 
    top: 0; 
    right: 0; 
    position: fixed; 
    height: calc(100vh - 6rem); 
    padding: 1.5rem 1rem; 
    overflow-y: auto; 
    overflow-x: hidden;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border-light);
    box-shadow: var(--shadow-md);
}

#right h3 {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
}

.top-right-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    gap: 0.5rem;
}

.top-right-controls h3 {
    margin: 0;
    flex: 1;
}

.control-buttons {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    position: relative;
}

.control-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    transition: color 0.2s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    border-radius: var(--radius-md);
    white-space: nowrap;
}

.control-btn:hover {
    color: var(--accent-primary);
    transform: scale(1.05);
}

.control-btn i {
    font-size: 0.875rem;
}

#username { 
    padding: 0.5rem 0.75rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    margin-bottom: 1.5rem;
    font-weight: 500;
}

.dashed { 
    display: inline-block; 
    border-bottom: 1px dashed var(--border-medium); 
    cursor: pointer; 
    margin-bottom: 1px;
    transition: all 0.2s ease;
}

.dashed:hover {
    border-bottom-color: var(--accent-primary);
    color: var(--accent-primary);
}

#usernameinput { 
    display: none; 
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
    font-family: inherit;
}

#connected {
    font-size: 0.875rem;
    line-height: 1.6;
}

#connected div {
    padding: 0.25rem 0;
    color: var(--text-secondary);
}

/* Previous messages link */
#previous { 
    margin-bottom: 1.5rem; 
    display: block;
    text-align: center;
    padding: 0.75rem 1rem;
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    color: var(--accent-primary);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
}

#previous:hover {
    background: var(--accent-secondary);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

/* Popup */
#popup { 
    z-index: 1000; 
    position: fixed; 
    left: 50%; 
    top: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 400px;
    background: var(--bg-secondary); 
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    text-align: center; 
    padding: 2rem 1.5rem; 
    color: var(--text-primary);
}

.hidden { 
    display: none !important; 
}

.opaque { 
    opacity: 0.5;
    pointer-events: none;
}

/* Animations */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    #right {
        width: 280px;
        right: -280px;
        transition: right 0.3s ease;
        z-index: 200;
    }

    #right.open {
        right: 0;
    }

    #sidebar-toggle {
        position: fixed;
        top: 0.75rem;
        right: 0.75rem;
        width: 2.75rem;
        height: 2.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-primary);
        color: #fff;
        border: none;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        z-index: 300;
    }
    #sidebar-toggle:hover { background: var(--accent-hover); }

    #wrapper {
        width: 95%;
        margin: 1rem auto 6rem auto;
    }
    
    #input-wrapper {
        max-width: 95%;
    }
    
    .message-bubble {
        max-width: 85%;
    }
    
    #banner { 
        display: none; 
    }
}

@media (max-width: 480px) {
    #input-wrapper {
        padding: 0.75rem;
    }
    
    #writing {
        font-size: 1rem; /* Prevent zoom on iOS */
    }
    
    .message-bubble {
        max-width: 90%;
    }
}

/* Notification styles */
#notifications {
    margin-bottom: 1.5rem;
}


/* Fork banner */
#fork {
    z-index: 10;
}
#sidebar-toggle { display: none; }
/* Chess UI */
#invites .invite-item { margin: 0.25rem 0; padding: 0.25rem 0; color: var(--text-secondary); }
.invite-actions { display: inline-flex; gap: 0.5rem; margin-left: 0.5rem; }
.invite-btn { padding: 0.125rem 0.5rem; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--bg-secondary); cursor: pointer; font-size: 0.75rem; }
.invite-btn:hover { background: var(--accent-secondary); color: var(--accent-primary); }
#connected .user-row { display: flex; align-items: center; justify-content: space-between; padding: 0.25rem 0; }
#rejoin-wrapper { display: flex; align-items: center; justify-content: space-between; padding: 0.25rem 0; }
#invites .user-row { display: flex; align-items: center; justify-content: space-between; padding: 0.25rem 0; }
.invite-user-btn { padding: 0.125rem 0.5rem; border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--bg-secondary); color: var(--accent-primary); cursor: pointer; font-size: 0.75rem; }
.invite-user-btn:hover { background: var(--accent-secondary); }
#rejoin-game { padding: 0.5rem 0.75rem; background: var(--bg-tertiary); border: none; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; box-shadow: var(--shadow-sm); }
#rejoin-game:hover { background: var(--accent-secondary); color: var(--accent-primary); border-color: var(--accent-primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.link-sent { margin-left: 0.5rem; color: var(--text-secondary); font-size: 0.75rem; }

#chess-modal { z-index: 1000; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 95vw; max-width: 720px; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: 1rem; }
.chess-layout { display: grid; grid-template-columns: 1fr 240px; gap: 1rem; }
.chess-board { width: 100%; aspect-ratio: 1 / 1; display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; }
.chess-square { display: flex; align-items: center; justify-content: center; user-select: none; cursor: pointer; position: relative; }
:root { --chess-light: #eeeed2; --chess-dark: #769656; }
.chess-square.light { background: var(--chess-light); }
.chess-square.dark { background: var(--chess-dark); }
.chess-square.selected { outline: 3px solid var(--accent-primary); outline-offset: -3px; }
.chess-square.lastmove { box-shadow: inset 0 0 0 3px rgba(246, 223, 99, 0.45); }
.chess-square.drag-over { outline: 3px solid var(--accent-primary); outline-offset: -3px; }
.chess-square.in-check { box-shadow: inset 0 0 0 3px rgba(220, 53, 69, 0.6); }
.chess-panel { border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 0.75rem; height: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
.chess-panel-header { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem; }
.chess-panel h4 { margin: 0; color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
.chess-settings-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.25rem 0.5rem; font-size: 0.875rem; transition: color 0.2s ease, transform 0.2s ease; }
.chess-settings-btn:hover { color: var(--accent-primary); transform: scale(1.1); }
.chess-settings-dropdown { position: absolute; top: 100%; right: -0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 0.5rem 0; min-width: 180px; z-index: 100; margin-top: 0.5rem; }
.chess-settings-dropdown.hidden { display: none; }
.chess-settings-toggle { display: flex; align-items: center; gap: 0.5rem; width: 100%; padding: 0.5rem 0.75rem; border: none; background: none; color: var(--text-primary); cursor: pointer; font-size: 0.875rem; text-align: left; transition: background 0.2s ease; }
.chess-settings-toggle:hover { background: var(--accent-secondary); }
.chess-settings-toggle i { font-size: 1rem; color: var(--accent-primary); min-width: 1.25rem; }
.chess-settings-toggle.disabled i { color: var(--text-muted); opacity: 0.5; }

/* Board and Pieces Modal */
.board-pieces-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.board-pieces-modal.hidden { display: none; }
.board-pieces-panel { background: var(--bg-secondary); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); max-width: 90%; max-height: 90vh; display: flex; flex-direction: column; width: 900px; }
.board-pieces-header { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem; border-bottom: 1px solid var(--border-light); }
.board-pieces-header h2 { margin: 0; font-size: 1.5rem; color: var(--text-primary); }
.board-pieces-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.5rem; padding: 0; transition: color 0.2s ease; }
.board-pieces-close:hover { color: var(--accent-primary); }
.board-pieces-content { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 2rem; }
.board-pieces-section h3 { margin: 0 0 1rem 0; font-size: 1.125rem; color: var(--text-primary); }
.boards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; }
.pieces-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; }
.board-card { padding: 0.75rem; border: 2px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-tertiary); cursor: pointer; transition: all 0.2s ease; text-align: center; }
.board-card:hover { border-color: var(--accent-primary); background: var(--accent-secondary); }
.board-card.selected { border-color: var(--accent-primary); background: var(--accent-secondary); font-weight: 600; }
.board-card-name { font-size: 0.875rem; color: var(--text-primary); font-weight: 500; }
.board-card-preview { width: 100%; height: 80px; background: white; border-radius: var(--radius-sm); margin-bottom: 0.5rem; object-fit: cover; }
.piece-card { padding: 0.75rem; border: 2px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-tertiary); cursor: pointer; transition: all 0.2s ease; text-align: center; }
.piece-card:hover { border-color: var(--accent-primary); background: var(--accent-secondary); }
.piece-card.selected { border-color: var(--accent-primary); background: var(--accent-secondary); font-weight: 600; }
.piece-card-name { font-size: 0.875rem; color: var(--text-primary); font-weight: 500; }
.piece-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
.piece-preview-icon { width: 100%; aspect-ratio: 1; }
.chess-status { min-height: 1.5rem; color: var(--text-secondary); }
.chess-actions { margin-top: auto; display: flex; gap: 0.5rem; }
.chess-button { padding: 0.5rem 0.75rem; border: 1px solid var(--border-light); border-radius: var(--radius-md); background: var(--bg-secondary); cursor: pointer; }
.chess-button:hover { background: var(--accent-secondary); color: var(--accent-primary); }
.chess-button.hidden { display: none; }
/* Confirm move button (neon green) */
.confirm-move-button { background: #39ff14; border: 1px solid #39ff14; color: #000; font-weight: 600; }
.confirm-move-button:hover { filter: brightness(1.1); }
.confirm-move-button[disabled] { background: #a3f7a1; border-color: #a3f7a1; color: #27472b; cursor: not-allowed; }
/* Premove highlight (slightly red, like chess.com) */
.chess-square.premove { box-shadow: inset 0 0 0 3px rgba(220, 53, 69, 0.35); }
.chess-square.premove::after { content: ''; position: absolute; inset: 0; background: rgba(220, 53, 69, 0.08); pointer-events: none; }
/* History control styles */
.history-controls .chess-button { width: 2.25rem; height: 2.25rem; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
.history-controls .chess-button:disabled { opacity: 0.45; cursor: not-allowed; }
/* Tentative move visuals */
.chess-square.tentative-source .chess-piece { opacity: 0.08 !important; }
.chess-piece.tentative-piece { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: 80% auto; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); opacity: 0.95; transform: translateZ(0); }
/* Tentative move visuals */
.chess-square.tentative-source .chess-piece { opacity: 0.08 !important; }
.chess-piece.tentative-piece { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: 80% auto; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); opacity: 0.95; transform: translateZ(0); }

/* Pieces (Staunton-style via external assets) */
.chess-piece { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: 80% auto; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); pointer-events: auto; cursor: grab; }
.chess-piece.dragging { cursor: grabbing; opacity: 0.6; }
/* White */
.piece-wk { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wK.png'); }
.piece-wq { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wQ.png'); }
.piece-wr { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wR.png'); }
.piece-wb { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wB.png'); }
.piece-wn { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wN.png'); }
.piece-wp { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wP.png'); }
/* Black */
.piece-bk { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/bK.png'); }
.piece-bq { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/bQ.png'); }
.piece-br { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/bR.png'); }
.piece-bb { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/bB.png'); }
.piece-bn { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/bN.png'); }
.piece-bp { background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/bP.png'); }

<script type="text/javascript">
var popsound = new Audio('popsound.mp3');
popsound.muted = true; // Mute initially to comply with browser autoplay policies
var __audioUnmuted = false; // Track if audio has been unmuted after user interaction

// Safe audio playback function that handles autoplay policy restrictions
function playNotificationSound() {
    if (!popsound) return;
    if (!__audioUnmuted) {
        return;
    }
    try {
        popsound.currentTime = 0;
        var playPromise = popsound.play();
        if (playPromise !== undefined) {
            playPromise.catch(function(error) {
                console.warn('Audio playback failed:', error);
            });
        }
    } catch (e) {
        console.warn('Error playing notification sound:', e);
    }
}

var API_BASE = (location.protocol === 'file:') ? (window.__API_BASE_OVERRIDE__ || 'http://localhost:12000') : '';
var randomname = 'user' + Math.floor((Math.random() * 1000) + 1);
var displayeduser;
var ws;
var lastPong;
var users;
var offlineUsers;
var firstId;
var lastId;
var loop;
var __logoutRequested = false;

// Tab notification badge
var __origTitle = document.title;
var __unread = 0;
var __chessUnread = 0;
function __updateTitleBadge(){
  var parts = [];
  if (__unread > 0) parts.push('(' + __unread + ')');
  if (__chessUnread > 0) parts.push('♟' + __chessUnread);
  document.title = (parts.length ? parts.join(' ') + ' ' : '') + __origTitle;
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { __unread = 0; __chessUnread = 0; __updateTitleBadge(); } });
window.addEventListener('focus', function(){ __unread = 0; __chessUnread = 0; __updateTitleBadge(); });

// Chess state
var chessGame = null; // {id, white, black, color, fen, turn, lastMove}
var selectedSquare = null;
var dragSourceSquare = null;
var pendingPromotion = null;
var pendingUserMove = null; // {from,to,promotion}
var premoveQueue = [];
var currentTentative = null; // {from,to,isPremove}
// Guards to prevent re-entrant premove processing and concurrent engine fetches
var __processingPremoves = false;
// Chess settings
var chessSettings = { confirmMoves: true, premoveEnabled: true };

// Board and Pieces settings
var boardPiecesSettings = {
    selectedBoard: 'tan',
    selectedPieces: 'classic',
    boardsData: null,
    piecesData: null
};

// Load boards and pieces data
function loadBoardPiecesData() {
    fetch('https://raw.githubusercontent.com/Adrunkenronin/chess.com-boards-and-pieces/master/data.json')
        .then(response => response.json())
        .then(data => {
            boardPiecesSettings.boardsData = data.boards || {};
            boardPiecesSettings.piecesData = data.pieces || {};
            initializeBoardPiecesModal();
        })
        .catch(error => console.error('Failed to load board pieces data:', error));
}

function initializeBoardPiecesModal() {
    if (!boardPiecesSettings.boardsData || !boardPiecesSettings.piecesData) return;

    const boardsGrid = document.getElementById('boards-grid');
    const piecesGrid = document.getElementById('pieces-grid');

    // Create board cards
    Object.entries(boardPiecesSettings.boardsData).forEach(([boardName, boardData]) => {
        const card = document.createElement('div');
        card.className = 'board-card';
        if (boardName === boardPiecesSettings.selectedBoard) {
            card.classList.add('selected');
        }

        const previewUrl = boardData.url.replace('{size}', '140');
        const cardHTML = `
            <img class="board-card-preview" src="${previewUrl}" alt="${boardName}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Crect fill=%22%23ccc%22 width=%22140%22 height=%22140%22/%3E%3C/svg%3E'" />
            <div class="board-card-name">${boardName.replace(/_/g, ' ')}</div>
        `;
        card.innerHTML = cardHTML;
        card.addEventListener('click', () => selectBoard(boardName, card));
        boardsGrid.appendChild(card);
    });

    // Create piece cards
    Object.entries(boardPiecesSettings.piecesData).forEach(([pieceName, pieceData]) => {
        const card = document.createElement('div');
        card.className = 'piece-card';
        if (pieceName === boardPiecesSettings.selectedPieces) {
            card.classList.add('selected');
        }

        const pieceNames = ['wk', 'wq', 'wp', 'bk', 'bq', 'bp'];
        const previewHTML = pieceNames.map(piece => {
            const url = pieceData.url.replace('{size}', '32').replace('{piece}', piece);
            return `<img class="piece-preview-icon" src="${url}" alt="${piece}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22%3E%3Crect fill=%22%23eee%22 width=%2232%22 height=%2232%22/%3E%3C/svg%3E'" />`;
        }).join('');

        const cardHTML = `
            <div class="piece-preview">${previewHTML}</div>
            <div class="piece-card-name">${pieceName.replace(/_/g, ' ')}</div>
        `;
        card.innerHTML = cardHTML;
        card.addEventListener('click', () => selectPieces(pieceName, card));
        piecesGrid.appendChild(card);
    });
}

function selectBoard(boardName, cardElement) {
    document.querySelectorAll('.board-card').forEach(card => card.classList.remove('selected'));
    cardElement.classList.add('selected');
    boardPiecesSettings.selectedBoard = boardName;
    applyBoardAndPieces();
}

function selectPieces(pieceName, cardElement) {
    document.querySelectorAll('.piece-card').forEach(card => card.classList.remove('selected'));
    cardElement.classList.add('selected');
    boardPiecesSettings.selectedPieces = pieceName;
    applyBoardAndPieces();
}

function applyBoardAndPieces() {
    if (!boardPiecesSettings.boardsData || !boardPiecesSettings.piecesData) return;

    const boardData = boardPiecesSettings.boardsData[boardPiecesSettings.selectedBoard];
    const pieceData = boardPiecesSettings.piecesData[boardPiecesSettings.selectedPieces];

    if (!boardData || !pieceData) return;

    // Update board background
    const boardUrl = boardData.url.replace('{size}', '600');
    const board = document.getElementById('chess-board');
    if (board) {
        board.style.backgroundImage = `url('${boardUrl}')`;
    }

    // Update piece images
    updateChessPieceImages(pieceData);
}

function updateChessPieceImages(pieceData) {
    const squares = document.querySelectorAll('.chess-square');
    squares.forEach(square => {
        const piece = square.getAttribute('data-piece');
        if (piece) {
            const pieceUrl = pieceData.url.replace('{size}', '60').replace('{piece}', piece);
            const img = square.querySelector('.piece-img');
            if (img) {
                img.src = pieceUrl;
            }
        }
    });
}

// Stockfish state
var stockfishGame = null; // {fen, turn, color, engineColor, elo, over}
var stockfishEngine = null;
var stockfishReady = false;

function is_scrolled_end() { // See http://stackoverflow.com/a/40370876/1422096
    return ((window.innerHeight + window.pageYOffset) >= document.body.offsetHeight);
}

function scroll_end () {
    document.body.scrollTop = document.body.scrollHeight;                           // both useful because this one not working in FF47
    document.documentElement.scrollTop = document.documentElement.scrollHeight;     // both useful because this one not working in Chrome 43 Android
}

function scroll_top () {
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
}    

function add_urls(s) {
    return s.replace(/(https?:\/\/[^ ]+)/g, '<a href="$1" target="_blank">$1<\/a>');
}

function timeConverter(t) {     // http://stackoverflow.com/a/40449006/1422096
    if (t == null) 
        return '';
    var a = new Date(t * 1000);
    var today = new Date();
    var yesterday = new Date(Date.now() - 86400000);
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var year = a.getFullYear();
    var month = months[a.getMonth()];
    var date = a.getDate();
    var hour = a.getHours();
    var min = a.getMinutes();
    var time = ("0" + hour).slice(-2) + ':' + ("0" + min).slice(-2);
    if (a.setHours(0,0,0,0) == today.setHours(0,0,0,0))
        return 'today, ' + time;
    else if (a.setHours(0,0,0,0) == yesterday.setHours(0,0,0,0))
        return 'yesterday, ' + time;
    else if (year == today.getFullYear())
        return date + ' ' + month + ', ' + time;
    else
        return date + ' ' + month + ' ' + year + ', ' + time;
}

function mediaPlaybackRequiresUserGesture() { // http://stackoverflow.com/a/40474415/1422096
  var audio = document.createElement('audio');
  audio.muted = true;
  try {
    var playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.catch(function(error) {
        console.warn('Audio playback check failed:', error);
      });
    }
  } catch (e) {
    console.warn('Error checking audio playback:', e);
  }
  return audio.paused;
}


function renderBoard() {
    if (!chessGame) return;
    var board = $('#chess-board');
    board.empty();

    // Apply board background
    if (boardPiecesSettings.boardsData && boardPiecesSettings.selectedBoard) {
        var boardData = boardPiecesSettings.boardsData[boardPiecesSettings.selectedBoard];
        if (boardData) {
            var boardUrl = boardData.url.replace('{size}', '600');
            board.css('backgroundImage', 'url(' + boardUrl + ')');
        }
    }

    if (pendingPromotion) {
        hidePromotionDialog();
    } else {
        clearSelection();
    }
    dragSourceSquare = null;

    var parts = chessGame.fen.split(' ');
    var ranksFEN = parts[0].split('/');
    var files = ['a','b','c','d','e','f','g','h'];
    var mapPiece = { 'P':'wp','N':'wn','B':'wb','R':'wr','Q':'wq','K':'wk','p':'bp','n':'bn','b':'bb','r':'br','q':'bq','k':'bk' };
    chessGame.squareMap = {};
    for (var r = 0; r < 8; r++) {
        var row = ranksFEN[r];
        var fileIndex = 0;
        for (var i = 0; i < row.length; i++) {
            var ch = row[i];
            if (/[1-8]/.test(ch)) {
                fileIndex += parseInt(ch, 10);
            } else {
                var file = files[fileIndex];
                var rank = 8 - r; // FEN rows start at rank 8
                var sq = file + String(rank);
                var pieceCode = mapPiece[ch] || null;
                if (pieceCode) chessGame.squareMap[sq] = pieceCode;
                fileIndex++;
            }
        }
    }

    function appendSquare(sq) {
        var fIndex = sq.charCodeAt(0) - 97; // 'a' -> 0
        var rNum = parseInt(sq.charAt(1), 10);
        var light = ((fIndex + rNum) % 2) === 0;
        var el = $('<div class="chess-square" />').addClass(light ? 'light' : 'dark').attr('data-square', sq);
        var pieceCode = chessGame.squareMap[sq];
        if (pieceCode) {
            var pieceEl = $('<div/>').addClass('chess-piece').addClass('piece-' + pieceCode).attr('draggable', true).attr('data-square', sq).attr('data-piece', pieceCode);
            el.append(pieceEl);
        }
        var histEntry = (chessGame.moveHistory && typeof chessGame.historyIndex !== 'undefined') ? chessGame.moveHistory[chessGame.historyIndex] : null;
        if ((histEntry && (sq === histEntry.from || sq === histEntry.to)) || (chessGame.lastMove && (sq === chessGame.lastMove.from || sq === chessGame.lastMove.to))) el.addClass('lastmove');
        board.append(el);
    }

    var rankOrder = (chessGame.color === 'white') ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
    var fileOrder = (chessGame.color === 'white') ? files : files.slice().reverse();
    for (var ri = 0; ri < rankOrder.length; ri++) {
        for (var fi = 0; fi < fileOrder.length; fi++) {
            appendSquare(fileOrder[fi] + String(rankOrder[ri]));
        }
    }

    $('#chess-board .chess-square').removeClass('in-check');
    if (chessGame.inCheck) {
        var targetKing = (chessGame.turn === 'white') ? 'wk' : 'bk';
        var kingSq = null;
        for (var key in chessGame.squareMap) {
            if (chessGame.squareMap[key] === targetKing) { kingSq = key; break; }
        }
        if (kingSq) {
            $('#chess-board .chess-square[data-square="' + kingSq + '"]').addClass('in-check');
        }
    }
    // Re-apply premove highlights after board render
    renderPremoveHighlights();
    // Re-apply any tentative visuals (staged move or latest premove)
    if (pendingUserMove && pendingUserMove.from && pendingUserMove.to) {
        currentTentative = { from: pendingUserMove.from, to: pendingUserMove.to, isPremove: false };
        showTentativeMove(pendingUserMove.from, pendingUserMove.to);
    } else if (premoveQueue && premoveQueue.length) {
        var last = premoveQueue[premoveQueue.length - 1];
        currentTentative = { from: last.from, to: last.to, isPremove: true };
        showTentativeMove(last.from, last.to, true);
    }
}

function squarePieceCode(sq) {
    if (!chessGame || !chessGame.squareMap) return null;
    return chessGame.squareMap[sq] || null;
}

function isPlayersPiece(pieceCode) {
    if (!chessGame || !pieceCode) return false;
    if (stockfishGame) {
        var playerColorLetter = stockfishGame.color === 'w' ? 'w' : 'b';
        return pieceCode.charAt(0) === playerColorLetter;
    }
    if (pieceCode.charAt(0) === 'w') return chessGame.color === 'white';
    if (pieceCode.charAt(0) === 'b') return chessGame.color === 'black';
    return false;
}

function clearSelection() {
    selectedSquare = null;
    $('#chess-board .chess-square').removeClass('selected');
}

function requiresPromotion(pieceCode, targetSquare) {
    if (!pieceCode || pieceCode.charAt(1) !== 'p') return false;
    var rank = parseInt(String(targetSquare).charAt(1), 10);
    if (isNaN(rank)) return false;
    if (pieceCode.charAt(0) === 'w') return rank === 8;
    return rank === 1;
}

function openPromotionDialog(from, to, pieceCode) {
    pendingPromotion = { from: from, to: to, color: pieceCode.charAt(0) };
    var options = $('#promotion-options');
    options.empty();
    var prefix = pendingPromotion.color;
    ['q','r','b','n'].forEach(function(symbol) {
        var option = $('<button type="button" class="promotion-choice" />').attr('data-promotion', symbol);
        option.append($('<div/>').addClass('promotion-piece').addClass('piece-' + prefix + symbol));
        options.append(option);
    });
    $('#chess-board .chess-square').removeClass('selected');
    $('#chess-board .chess-square[data-square="' + from + '"]').addClass('selected');
    $('#chess-board .chess-square[data-square="' + to + '"]').addClass('selected');
    selectedSquare = from;
    $('#promotion-overlay').removeClass('hidden');
}

function hidePromotionDialog() {
    pendingPromotion = null;
    $('#promotion-overlay').addClass('hidden');
    $('#promotion-options').empty();
    clearSelection();
}

function sendMove(from, to, promotion) {
    if (!chessGame) return;
    if (stockfishGame) {
        handleStockfishMove(from, to, promotion);
        clearPendingMove();
        return;
    }
    if (!ws || ws.readyState !== 1) return;
    var payload = { type: 'chess_move', game_id: chessGame.id, from: from, to: to };
    if (promotion) payload.promotion = promotion;
    ws.send(JSON.stringify(payload));
    clearSelection();
    $('#chess-board .chess-square').removeClass('drag-over');
    clearPendingMove();
}

function updateConfirmButton(){
    var $btn = $('#chess-confirm-move');
    if (!$btn.length) return;
    var canConfirm = !!pendingUserMove && chessGame && (chessGame.turn === chessGame.color);
    $btn.prop('disabled', !canConfirm);
}

function clearPendingMove(){
    pendingUserMove = null;
    updateConfirmButton();
    clearTentativeMoveVisuals();

function stageMove(from, to, promotion){
    // Clear existing tentative visuals
    clearTentativeMoveVisuals();

    // If confirm moves is disabled, send immediately
    if (!chessSettings.confirmMoves) {
        sendMove(from, to, promotion);
        return;
    }

    pendingUserMove = { from: from, to: to, promotion: promotion || null };
    $('#chess-board .chess-square').removeClass('selected');
    $('#chess-board .chess-square[data-square="' + from + '"]').addClass('selected');
    $('#chess-board .chess-square[data-square="' + to + '"]').addClass('selected');
    currentTentative = { from: from, to: to, isPremove: false };
    showTentativeMove(from, to);
    updateConfirmButton();
    flashStatus('Move ready. Press Confirm');
}

function enqueuePremove(from, to, promotion){
    premoveQueue.push({ from: from, to: to, promotion: promotion || null });
    flashStatus('Premove queued');
    // Show the latest premove as tentative visual
    var mv = premoveQueue[premoveQueue.length - 1];
    clearTentativeMoveVisuals();
    currentTentative = { from: mv.from, to: mv.to, isPremove: true };
    showTentativeMove(mv.from, mv.to, true);
    renderPremoveHighlights();
}

function isMyTurn(){
    if (!chessGame) return false;
    return chessGame.turn === chessGame.color;
}

function tryPlayPremoves(){
    if (__processingPremoves) return; // avoid re-entrancy
    __processingPremoves = true;
    try {
        if (!chessGame || !premoveQueue.length) return;

        // Attempt to play as many premoves as possible while it's our turn
        while (premoveQueue.length && isMyTurn()) {
            var mv = premoveQueue.shift();
            // Clear tentative visuals for premoves (we are about to play one)
            clearTentativeMoveVisuals();
            renderPremoveHighlights();

            if (stockfishGame) {
                // validate against current board
                var b = stockfishGame.board;
                var ok = b.move({ from: mv.from, to: mv.to, promotion: mv.promotion });
                if (ok) {
                    // we applied locally; roll back and send through existing flow which will apply the move
                    b.undo();
                    sendMove(mv.from, mv.to, mv.promotion);
                    // After sendMove in stockfish mode, the move is applied immediately by handleStockfishMove and turn changes,
                    // so continue loop will re-check isMyTurn() to decide whether to proceed to next premove.
                } else {
                    flashStatus('Premove illegal, skipped');
                    // continue to next queued premove without recursion
                    continue;
                }
            } else {
                // For online/multiplayer games: perform a local optimistic update to show movement,
                // then send the move to server. If server disagrees, it will overwrite when update arrives.
                try {
                    var sim = new Chess();
                    sim.load(chessGame.fen);
                    var applied = sim.move({ from: mv.from, to: mv.to, promotion: mv.promotion });
                    if (applied) {
                        // commit optimistic update locally
                        chessGame.fen = sim.fen();
                        chessGame.lastMove = { from: applied.from, to: applied.to };
                        chessGame.moveHistory = chessGame.moveHistory || [];
                        chessGame.moveHistory.push({ fen: sim.fen(), from: applied.from, to: applied.to });
                        chessGame.historyIndex = chessGame.moveHistory.length - 1;
                        renderBoard();
                        // send to server
                        sendMove(mv.from, mv.to, mv.promotion);
                        // After sending, it's no longer our turn; break out and wait for server/opponent
                        break;
                    } else {
                        flashStatus('Premove illegal, skipped');
                        continue;
                    }
                } catch(e) {
                    // If simulation fails, fallback to sending the move and let server validate
                    sendMove(mv.from, mv.to, mv.promotion);
                    break;
                }
            }
        }

    } finally {
        __processingPremoves = false;
    }
}

// Prevent concurrent engine fetches — mark when a fetch is in flight

function attemptMove(from, to) {
    if (!chessGame || pendingPromotion) return;
    // Do not allow moves while viewing history
    if (chessGame && chessGame.moveHistory && typeof chessGame.historyIndex !== 'undefined') {
        var last = chessGame.moveHistory.length - 1;
        if (chessGame.historyIndex !== last) { flashStatus('Return to latest position to move'); clearSelection(); return; }
    }
    if (!from || !to || from === to) return;
    var pieceCode = squarePieceCode(from);
    if (!pieceCode) { clearSelection(); return; }
    if (!isPlayersPiece(pieceCode)) { flashStatus('Not your piece'); clearSelection(); return; }
    var myTurn = isMyTurn();
    if (requiresPromotion(pieceCode, to)) {
        // Mark promotion context
        pendingPromotion = { from: from, to: to, color: pieceCode.charAt(0), mode: myTurn ? 'confirm' : 'premove' };
        var options = $('#promotion-options');
        options.empty();
        var prefix = pendingPromotion.color;
        ['q','r','b','n'].forEach(function(symbol) {
            var option = $('<button type="button" class="promotion-choice" />').attr('data-promotion', symbol);
            option.append($('<div/>').addClass('promotion-piece').addClass('piece-' + prefix + symbol));
            options.append(option);
        });
        $('#chess-board .chess-square').removeClass('selected');
        $('#chess-board .chess-square[data-square="' + from + '"]').addClass('selected');
        $('#chess-board .chess-square[data-square="' + to + '"]').addClass('selected');
        selectedSquare = from;
        $('#promotion-overlay').removeClass('hidden');
    } else {
        if (myTurn) {
            stageMove(from, to, null);
        } else {
            if (!chessSettings.premoveEnabled) {
                flashStatus('Premove disabled');
                clearSelection();
                return;
            }
            enqueuePremove(from, to, null);
        }
    }
}

function onSquareClick() {
    if (!chessGame || pendingPromotion) return;
    var sq = $(this).data('square');
    var pieceCode = squarePieceCode(sq);
    var myTurn = chessGame.turn === chessGame.color;
    if (!selectedSquare) {
        if (!pieceCode) return;
        if (!isPlayersPiece(pieceCode)) { flashStatus('Not your piece'); return; }
        selectedSquare = sq;
        $('#chess-board .chess-square').removeClass('selected');
        $(this).addClass('selected');
        return;
    }
    if (selectedSquare === sq) {
        clearSelection();
        return;
    }
    if (pieceCode && isPlayersPiece(pieceCode)) {
        // If user had a staged move, cancel it when they explicitly select a different piece
        if (pendingUserMove) clearPendingMove();
        clearTentativeMoveVisuals();
        selectedSquare = sq;
        $('#chess-board .chess-square').removeClass('selected');
        $(this).addClass('selected');
        return;
    }
    attemptMove(selectedSquare, sq);
}

function onPieceDragStart(e) {
    if (!chessGame || pendingPromotion) { e.preventDefault(); return; }
    // Do not allow dragging while viewing history
    if (chessGame && chessGame.moveHistory && typeof chessGame.historyIndex !== 'undefined') {
        var last = chessGame.moveHistory.length - 1;
        if (chessGame.historyIndex !== last) { flashStatus('Return to latest position to move'); e.preventDefault(); return; }
    }
    var parentSquare = $(this).parent().data('square');
    var pieceCode = squarePieceCode(parentSquare);
    if (!pieceCode) { e.preventDefault(); return; }
    if (!isPlayersPiece(pieceCode)) { flashStatus('Not your piece'); e.preventDefault(); return; }
    dragSourceSquare = parentSquare;
    $('#chess-board .chess-square').removeClass('selected');
    $('#chess-board .chess-square[data-square="' + parentSquare + '"]').addClass('selected');
    selectedSquare = parentSquare;
    $(this).addClass('dragging');
    var dt = e.originalEvent && e.originalEvent.dataTransfer;
    if (dt) {
        dt.setData('text/plain', parentSquare);
        dt.effectAllowed = 'move';
    }
}

function clearPremovePreviews(){

// Render premove highlights and ghost pieces indicating where queued premoves will land
function renderPremoveHighlights(){
    clearPremovePreviews();
    if (!premoveQueue || !premoveQueue.length) return;

    // Attempt to simulate the queued premoves on a cloned chess board so later premoves show correct targets
    try {
        if (typeof Chess === 'undefined') {
            // fall back to simple highlight of destinations
            premoveQueue.forEach(function(m){
                try { $('#chess-board .chess-square[data-square="' + m.to + '"]').addClass('premove'); } catch(e){}
            });
            return;
        }
        var sim = new Chess();
        try { sim.load(chessGame.fen); } catch(e) { sim = new Chess(); }
        // For each premove, try to apply it on the simulated board and place a ghost piece on the destination
        premoveQueue.forEach(function(m, idx){
            try {
                var mv = sim.move({ from: m.from, to: m.to, promotion: m.promotion });
                if (mv) {
                    // highlight the destination square
                    var $to = $('#chess-board .chess-square[data-square="' + mv.to + '"]');
                    $to.addClass('premove');
                    // create a ghost piece representing the piece that will end up on the destination
                    var colorPrefix = mv.color === 'w' ? 'w' : 'b';
                    var pieceCode = colorPrefix + mv.piece; // e.g., 'wp','wn'
                    var $ghost = $('<div/>').addClass('chess-piece premove-ghost').addClass('piece-' + pieceCode);
                    // Add data attributes for debugging or interaction
                    $ghost.attr('data-premove-index', idx);
                    $ghost.attr('data-piece', pieceCode);
                    $to.append($ghost);
                } else {
                    // illegal on simulated board: still mark intended destination with subtle highlight
                    $('#chess-board .chess-square[data-square="' + m.to + '"]').addClass('premove');
                }
            } catch(e) {
                try { $('#chess-board .chess-square[data-square="' + m.to + '"]').addClass('premove'); } catch(_e){}
            }
        });
    } catch(e) {
        // last-resort: highlight destinations only
        premoveQueue.forEach(function(m){ try { $('#chess-board .chess-square[data-square="' + m.to + '"]').addClass('premove'); } catch(e){} });
    }
}

function showTentativeMove(from, to, isPremove){
    try {
        clearTentativeMoveVisuals();
        var $fromSq = $('#chess-board .chess-square[data-square="' + from + '"]');
        var $toSq = $('#chess-board .chess-square[data-square="' + to + '"]');
        if (!$fromSq.length || !$toSq.length) return;
        var $piece = $fromSq.find('.chess-piece').first();
        if (!$piece.length) return;
        // mark source as tentative (hide/ghost)
        $fromSq.addClass('tentative-source');
        $toSq.addClass('tentative-target');
        // clone piece into target as tentative-piece
        var cls = '';
        $.each($piece.attr('class').split(/\s+/), function(i,c){ if (c.indexOf('piece-') === 0) cls = c; });
        var $clone = $('<div/>').addClass('chess-piece tentative-piece').addClass(cls);
        $toSq.append($clone);
    } catch(e){}
}

    });

    $('#right').on('click', '.invite-user-btn', function() {
        var toUser = $(this).data('user');
        if (!toUser) return;
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'chess_invite', to: toUser }));
            flashStatus('Invite sent to ' + toUser);
        }
        var row = $(this).closest('.user-row');
        row.find('.link-sent').remove();
        var msg = $('<span class="link-sent">link sent</span>');
        row.append(msg);
        setTimeout(function(){ msg.fadeOut(400, function(){ $(this).remove(); }); }, 3000);
    });
    $('#invites').on('click', '.invite-accept', function() {
        var fromUser = $(this).closest('.invite-item').data('from');
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'chess_invite_accept', from: fromUser }));
        $(this).closest('.invite-item').remove();
    });
    $('#invites').on('click', '.invite-decline', function() {
        $(this).closest('.invite-item').remove();
    });

    // Sidebar toggle (mobile)
    $('#sidebar-toggle').on('click', function(){ $('#right').toggleClass('open'); });

    // Chess settings dropdown toggle
    $('#chess-settings-btn').on('click', function(e) {
        e.stopPropagation();
        $('#chess-settings-dropdown').toggleClass('hidden');
    });

    // Close settings dropdown when clicking outside
    $(document).on('click', function(e) {
        if (!$(e.target).closest('#chess-settings-btn, #chess-settings-dropdown').length) {
            $('#chess-settings-dropdown').addClass('hidden');
        }
    });

    // Chess settings toggle buttons
    $('#chess-settings-dropdown').on('click', '.chess-settings-toggle', function(e) {
        e.preventDefault();
        var setting = $(this).data('setting');
        if (setting === 'confirm-moves') {
            chessSettings.confirmMoves = !chessSettings.confirmMoves;
            updateSettingUI('confirm-moves');
            if (!chessSettings.confirmMoves && pendingUserMove) {
                clearPendingMove();
            }
        } else if (setting === 'premove') {
            chessSettings.premoveEnabled = !chessSettings.premoveEnabled;
            updateSettingUI('premove');
            if (!chessSettings.premoveEnabled) {
                clearAllPremoves();
            }
        }
    });

    function updateSettingUI(setting) {
        var $toggle = $('#chess-settings-dropdown').find('[data-setting="' + setting + '"]');
        var $icon = $toggle.find('i');
        if (setting === 'confirm-moves') {
            if (chessSettings.confirmMoves) {
                $icon.removeClass('fa-toggle-off').addClass('fa-toggle-on');
                $toggle.removeClass('disabled');
                $('#chess-confirm-move').removeClass('hidden');
            } else {
                $icon.removeClass('fa-toggle-on').addClass('fa-toggle-off');
                $toggle.addClass('disabled');
                $('#chess-confirm-move').addClass('hidden');
            }
        } else if (setting === 'premove') {
            if (chessSettings.premoveEnabled) {
                $icon.removeClass('fa-toggle-off').addClass('fa-toggle-on');
                $toggle.removeClass('disabled');
            } else {
                $icon.removeClass('fa-toggle-on').addClass('fa-toggle-off');
                $toggle.addClass('disabled');
            }
        }
    }

    // Board and Pieces modal handlers
    $('#board-pieces-btn').on('click', function(e) {
        e.stopPropagation();
        $('#board-pieces-modal').removeClass('hidden');
        if (!boardPiecesSettings.boardsData) {
            loadBoardPiecesData();
        }
    });

    $('#board-pieces-close').on('click', function() {
        $('#board-pieces-modal').addClass('hidden');
    });

    // Close board-pieces modal when clicking outside
    $('#board-pieces-modal').on('click', function(e) {
        if (e.target.id === 'board-pieces-modal') {
            $(this).addClass('hidden');
        }
    });

    // Chess modal controls
    $('#chess-close').on('click', function(){
        $('#chess-modal').addClass('hidden');
        $('#chess-settings-dropdown').addClass('hidden');
        if (stockfishGame) {
            stockfishGame = null;
            chessGame = null;
        } else if (chessGame && !chessGame.over) {
            showRejoinPrompt();
            try { localStorage.setItem('active_game', JSON.stringify({ id: chessGame.id, white: chessGame.white, black: chessGame.black })); } catch(e){}
        }
    });
    $('#chess-confirm-move').on('click', function(){
        if (!pendingUserMove) return;
        var m = pendingUserMove; clearPendingMove();
        sendMove(m.from, m.to, m.promotion);
    });

    // Keyboard: Enter confirms staged move (unless typing in inputs)
    $(document).on('keydown.chessconfirm', function(e){
        // ignore when focus is in chat input or any text input
        var active = document.activeElement;
        if ($(active).is('textarea, input') || $(active).closest('#promotion-overlay').length) return;
        if (!$('#chess-modal').length || $('#chess-modal').hasClass('hidden')) return;

        if (e.key === 'Enter' && !e.shiftKey) {
            if (pendingUserMove && !$('#chess-confirm-move').prop('disabled')) {
                e.preventDefault();
                $('#chess-confirm-move').trigger('click');
            }
            return;
        }

        // Cancel all premoves on Left Arrow or Backspace
        if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
            e.preventDefault();
            clearAllPremoves();
            return;
        }
    });
    $('#chess-resign').on('click', function(){
        if (stockfishGame) {
            stockfishGame.over = true;
            $('#chess-modal').addClass('hidden');
            stockfishGame = null;
            chessGame = null;
        } else if (chessGame && ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'chess_resign', game_id: chessGame.id }));
        }
    });


    $('#chess-board')
        .on('click', '.chess-square', onSquareClick)
        .on('dragstart', '.chess-piece', onPieceDragStart)
        .on('dragend', '.chess-piece', onPieceDragEnd)
        .on('dragover', '.chess-square', onSquareDragOver)
        .on('dragleave', '.chess-square', onSquareDragLeave)
        .on('drop', '.chess-square', onSquareDrop);
    $('#promotion-options').on('click', '.promotion-choice', onPromotionChoice);
    $('#promotion-cancel').on('click', function(){ hidePromotionDialog(); });

    // history controls
    $('#chess-prev').on('click', function(){
        if (!chessGame || !chessGame.moveHistory) return;
        var idx = chessGame.historyIndex || 0;
        if (idx <= 0) return;
        chessGame.historyIndex = idx - 1;
        var entry = chessGame.moveHistory[chessGame.historyIndex];
        chessGame.fen = entry.fen;
        renderBoard();
        updateChessStatus();
        updateHistoryControls();
    });
    $('#chess-next').on('click', function(){
        if (!chessGame || !chessGame.moveHistory) return;
        var idx = chessGame.historyIndex || 0;
        var last = chessGame.moveHistory.length - 1;
        if (idx >= last) return;
        chessGame.historyIndex = idx + 1;
        var entry = chessGame.moveHistory[chessGame.historyIndex];
        chessGame.fen = entry.fen;
        renderBoard();
        updateChessStatus();
        updateHistoryControls();
    });

    function updateHistoryControls(){
        if (!chessGame || !chessGame.moveHistory) return;
        var idx = chessGame.historyIndex || 0;
        var last = chessGame.moveHistory.length - 1;
        $('#chess-prev').prop('disabled', idx <= 0);
        $('#chess-next').prop('disabled', idx >= last);
        // when viewing not-latest, block making moves
        if (idx < last) {
            // show visual hint
            $('#chess-status').text('Viewing move ' + idx + ' of ' + last + ' (use arrows to return)');
        } else {
            updateChessStatus();
        }
    }
    // expose to global so other non-closure code can call it
    try { window.updateHistoryControls = updateHistoryControls; } catch(e){}

    // Rejoin button handler (delegated)
    $('#invites').on('click', '#rejoin-game', function(){
        if (chessGame && !chessGame.over) {
            $('#chess-modal').removeClass('hidden');
            __chessUnread = 0; __updateTitleBadge();
            renderBoard();
            updateChessStatus();
            updateSettingUI('confirm-moves');
        }
    });

    function renderUserLists() {
        var me = $('#username').text();
        var onlineHtml = users.map(function(u){
            if (u === me) return '<div class="user-row"><span>' + u + '</span></div>';
            return '<div class="user-row"><span>' + u + '</span><button class="invite-user-btn" data-user="' + u + '">Invite</button></div>';
        }).join('');
        $('#connected').html(onlineHtml);
    }

    function addInvite(fromUser) {
        var item = $('<div class="invite-item" />').attr('data-from', fromUser).text('Invite from ' + fromUser);
        var actions = $('<span class="invite-actions" />');
        actions.append('<button class="invite-btn invite-accept">Accept</button>');
        actions.append('<button class="invite-btn invite-decline">Decline</button>');
        item.append(actions);
        $('#invites').append(item);
    }

    function showRejoinPrompt() {
        if (!$('#invites #rejoin-game').length) {
            var wrap = $('<div class="user-row" id="rejoin-wrapper" />');
            var btn = $('<button class="invite-user-btn" id="rejoin-game">game in progress</button>');
            wrap.append(btn);
            $('#invites').append(wrap);
        }
    }

    function hideRejoinPrompt() {
        $('#rejoin-wrapper').remove();
    }

    function startChessGame(data) {
        __chessUnread = 0; __updateTitleBadge();
        var me = $('#username').text();
        chessGame = {
            id: data['game_id'],
            white: data['white'],
            black: data['black'],
            color: (data['white'] === me) ? 'white' : 'black',
            fen: data['fen'],
            turn: data['turn'],
            lastMove: null,
            over: false,
            moveHistory: [{ fen: data['fen'], from: null, to: null }],
            historyIndex: 0
        };
        hideRejoinPrompt();
        $('#chess-white').text(chessGame.white);
        $('#chess-black').text(chessGame.black);
        $('#chess-status').text('Your color: ' + chessGame.color);
        pendingUserMove = null; premoveQueue = []; updateConfirmButton();
        renderBoard();
        updateHistoryControls && updateHistoryControls();
        $('#chess-modal').removeClass('hidden');
        updateSettingUI('confirm-moves');
    }

    // WebSocket message handler
    function handleWsMessage(e) { 
        lastPong = Date.now();
        if (typeof e['data'] === 'string' && e['data'].slice(0,2) === 'id') {
            var serverlastid = e['data'].slice(2);
            if (serverlastid != lastId) { // some messages were lost
                if (ws && ws.readyState === 1) ws.send(JSON.stringify({'type': 'messagesafter', 'id': lastId}));
            }
            return;
        }
        var data;
        try { data = JSON.parse(e['data']); } catch(_) { return; }
        if (data['type'] === 'message') {
            if (data['id'] > lastId + 1) {  // some messages were lost
                if (ws && ws.readyState === 1) ws.send(JSON.stringify({'type': 'messagesafter', 'id': lastId}));
                return;
            }
            lastId = data['id'];
            var isscrolledend = is_scrolled_end();
            var isOwnMessage = data['username'] === $('#username').text();
            var bubbleClass = isOwnMessage ? 'own' : 'other';
            var messageHtml = '<div class="message-bubble ' + bubbleClass + '">' +
                '<div class="message-username">' + data['username'] + '</div>' +
                '<div class="message-content">' +
                    '<div class="message-timestamp">' + timeConverter(data['datetime']) + '</div>' +
                    add_urls(data['message']) +
                '</div>' +
                '</div>';
            $('#main').append(messageHtml);
            if (isscrolledend)
                scroll_end();
            if (data['username'] !== $('#username').text() && data['username'] !== displayeduser && $('#notificationswitch').text() === 'on') {
                playNotificationSound();
            }
            if (document.hidden && data['username'] !== $('#username').text()) {
                __unread += 1; __updateTitleBadge();
            }
        }
        else if (data['type'] === 'messages') {
            var newmessages = document.createDocumentFragment();
            var messagelist = data['messages'];
            for (var i = 0; i < messagelist.length; i++) {
                var msg = JSON.parse(messagelist[i]);
                if (data['before'] != 1 && msg['id'] <= lastId)       // message already added 
                    continue;
                var isOwnMessage = msg['username'] === $('#username').text();
                var bubbleClass = isOwnMessage ? 'own' : 'other';
                var messageHtml = '<div class="message-bubble ' + bubbleClass + '">' +
                    '<div class="message-username">' + msg['username'] + '</div>' +
                    '<div class="message-content">' +
                        '<div class="message-timestamp">' + timeConverter(msg['datetime']) + '</div>' +
                        add_urls(msg['message']) +
                    '</div>' +
                    '</div>';
                $(newmessages).append(messageHtml);
                firstId = Math.min(firstId, msg['id'])
                lastId = Math.max(lastId, msg['id']);
            }
            if (data['before'] == 1)
                $('#main').prepend(newmessages); 
            else
                $('#main').append(newmessages);
            if (firstId > 0 && firstId != Infinity)
                $('#previous').removeClass('hidden');
            else
                $('#previous').addClass('hidden');
            if (data['before'] == 1)
                scroll_top();
            else
                scroll_end();
        }
        else if (data['type'] === 'userlist') {
            users = data['connected'];
            offlineUsers = data['offline'] || [];
            renderUserLists();
        }
        else if (data['type'] === 'chess_invite') {
            addInvite(data['from']);
            if (document.hidden || data['offline']) { __chessUnread += 1; __updateTitleBadge(); }
        }
        else if (data['type'] === 'chess_resume') {
            var me = $('#username').text();
            chessGame = {
                id: data['game_id'],
                white: data['white'],
                black: data['black'],
                color: (data['white'] === me) ? 'white' : 'black',
                fen: data['fen'],
                turn: data['turn'],
                lastMove: null,
                over: false
            };
            try { localStorage.setItem('active_game', JSON.stringify({ id: chessGame.id, white: chessGame.white, black: chessGame.black })); } catch(e){}
            $('#chess-white').text(chessGame.white);
            $('#chess-black').text(chessGame.black);
            pendingUserMove = null; premoveQueue = []; updateConfirmButton();
            showRejoinPrompt();
        }
        else if (data['type'] === 'chess_start') {
            try { localStorage.setItem('active_game', JSON.stringify({ id: data['game_id'], white: data['white'], black: data['black'] })); } catch(e){}
            startChessGame(data);
        }
        else if (data['type'] === 'chess_move') {
            if (chessGame && chessGame.id === data['game_id']) {
                chessGame.fen = data['fen'];
                chessGame.turn = data['turn'];
                chessGame.inCheck = !!data['check'];
                chessGame.lastMove = { from: data['from'], to: data['to'] };
                // push history
                chessGame.moveHistory = chessGame.moveHistory || [];
                chessGame.moveHistory.push({ fen: data['fen'], from: data['from'], to: data['to'] });
                chessGame.historyIndex = chessGame.moveHistory.length - 1;
                renderBoard();
                updateChessStatus();
                updateHistoryControls && updateHistoryControls();
                clearPendingMove();
                tryPlayPremoves();
                if (document.hidden && chessGame.turn === chessGame.color) { __chessUnread += 1; __updateTitleBadge(); }
            }
        }
        else if (data['type'] === 'chess_over') {
            try { localStorage.removeItem('active_game'); } catch(e){}
            if (chessGame && chessGame.id === data['game_id']) {
                chessGame.over = true;
                $('#chess-status').text('Game over: ' + data['result'] + ' (' + data['reason'] + ')');
                hideRejoinPrompt();
            }
        }
        else if (data['type'] === 'chess_illegal') {
            flashStatus('Illegal move');
        }
        else if (data['type'] === 'chess_error') {
            flashStatus(data['message'] || 'Error');
        }
        else if (data['type'] === 'cleared') {
            $('#main').empty();
            firstId = Infinity;
            lastId = -1;
            $('#previous').addClass('hidden');
            scroll_end();
            flashStatus((data['by'] ? data['by'] + ' cleared chat' : 'Chat history cleared'));
        }
        else if (data['type'] === 'username') {  // server asks to (re)send username
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ "type" : "username", "username" : $('#username').text() }));
        }
        else if (data['type'] === 'usernameunavailable') {
            $('#username').text(data['username']);
            setStoredUsername($('#username').text());
            popup_message('Your username has been changed because the one you entered is reserved.', true, false);
        }
        else if (data['type'] === 'flood') {
            popup_message('Please do not flood this chat.', false, false);
            ws.onclose = undefined;
            clearInterval(loop);
            ws.close();
        }
        else if (data['type'] === 'displayeduser') {
            displayeduser = data['username'];
        }
    }

    // Attach onmessage when connection is established
    var _origOpen = connectWS;
    var __connectCalled = false;
    connectWS = function(){
        if (__connectCalled) return; __connectCalled = true; _origOpen();
        if (ws) ws.onmessage = handleWsMessage;
    };
}

$(document).ready(ready);

</script>
<script>
// Global handlers to suppress/handle external iframe evaluation timeouts (e.g. from builder.io CDN)
window.addEventListener('unhandledrejection', function(ev) {
  try {
    var reason = ev && ev.reason ? ev.reason : ev;
    var msg = (reason && reason.message) ? reason.message : String(reason);
    if (msg && (msg.indexOf('IFrame evaluation timeout') !== -1 || msg.indexOf('cdn.builder.io') !== -1 || msg.indexOf('IFrame evaluation') !== -1)) {
      // Non-fatal external iframe timeout from third-party script — log and prevent uncaught rejection
      console.warn('Suppressed external iframe error:', msg, reason);
      ev.preventDefault && ev.preventDefault();
      return;
    }
  } catch (e) { /* ignore */ }
});

window.addEventListener('error', function(ev) {
  try {
    var msg = ev && ev.message ? ev.message : '';
    if (msg && (msg.indexOf('IFrame evaluation timeout') !== -1 || msg.indexOf('cdn.builder.io') !== -1 || msg.indexOf('IFrame evaluation') !== -1)) {
      // Log and swallow to avoid noisy uncaught errors originating from injected third-party iframes
      console.warn('Suppressed external iframe error (window.error):', msg, ev.error || ev);
      ev.stopImmediatePropagation && ev.stopImmediatePropagation();
      return true;
    }
  } catch (e) { /* ignore */ }
});
</script>
